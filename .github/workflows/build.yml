name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar ficheiro
        run: cp app/build/outputs/apk/release/app-release.apk radio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: radio-apk
          path: radio.apk

      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh release upload latest radio.apk --clobber -R "$GITHUB_REPOSITORY" && exit 0
            echo "nova tentativa em 20 s"; sleep 20
          done
          exit 1
