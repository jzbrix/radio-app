<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Rádio</title>
<style>
/*
VOICE  calmo e noturno, como um auto-rádio de gama alta
IDEA   o mostrador de um rádio: estações como teclas de memória, a música em ecrã inteiro
PICTURE capa do álbum grande, com o fundo tingido pela própria capa
COLOUR preto profundo, superfícies grafite, vermelho de "no ar" como único acento
TYPE   system-ui, títulos pesados e compactos
*/
:root{color-scheme:dark;--bg:#0b0d10;--s1:#15181d;--s2:#1e232a;--line:#262c34;--ink:#f3f5f7;--mut:#98a2ad;--acc:#ff4d3d;--acc2:#ff7466;
  --nav:64px;--mini:68px;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
body{padding-bottom:calc(var(--nav) + var(--mini) + var(--sb) + 16px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:inherit;text-decoration:none}
svg{width:24px;height:24px;fill:currentColor;flex:none}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ib:active{background:var(--s2)}
.view{display:none;max-width:820px;margin:0 auto}
.view.on{display:block}
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(14px + var(--st)) 16px 10px;background:linear-gradient(var(--bg) 75%,transparent)}
.hd h1{flex:1;margin:0;font-size:32px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
.sec{padding:6px 16px 10px}
.sec h2{display:flex;align-items:baseline;gap:8px;font-size:20px;margin:14px 0 12px;letter-spacing:-.01em}
.sec h2 small{font-size:14px;color:var(--mut);font-weight:500}
.sec h2 button{margin-left:auto;font-size:14px;color:var(--acc2);font-weight:600;min-height:32px}
/* teclas de memória */
.sheet{position:fixed;inset:0;z-index:32;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
#ep{z-index:34}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
.shin{max-width:620px;margin:0 auto;padding:calc(8px + var(--st)) 20px calc(40px + var(--sb))}
#v-pods .hd{display:flex;flex-direction:column;align-items:stretch;gap:10px}
#pq{width:100%}
#podBody h2{font-size:20px;margin:18px 0 12px}
.podhead{display:flex;gap:16px;align-items:center;margin:6px 0 14px}
.podhead .lg{width:120px;height:120px;flex:none;border-radius:14px}
.podhead h2{margin:0 0 4px;font-size:22px;line-height:1.15}
.podhead p{margin:0;color:var(--mut);font-size:14px}
.follow{margin-top:10px;min-height:40px;padding:0 18px;border-radius:20px;background:var(--acc);color:#fff;font-weight:700}
.follow.on{background:var(--s1);color:var(--ink)}
.poddesc{color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.eprow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--s1)}
.eprow .lg{width:52px;height:52px;flex:none;border-radius:10px}
.eprow .tx{flex:1;min-width:0}
.eprow b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.3}
.eprow small{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.eprow .pb{height:3px;border-radius:2px;background:var(--s2);margin-top:6px;overflow:hidden}
.eprow .pb i{display:block;height:100%;background:var(--acc)}
.eprow .pl{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--s1)}
.eprow .pl svg{width:22px;height:22px}
.eprow.done b{color:var(--mut)}
#epTitle{margin:18px 0 4px;font-size:clamp(20px,5.5vw,26px);line-height:1.2;text-align:center}
.eplink{flex:1;text-align:center;color:var(--mut);font-size:14px;font-weight:600;min-height:40px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:44px}
#epBar{width:100%;margin:18px 0 4px;accent-color:var(--acc);height:28px}
.eptimes{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
#epPlay{width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
#epPlay svg{width:38px;height:38px}
.skip{position:relative}.skip b{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800;padding-top:3px}
#epRate{font-size:18px;color:var(--ink)}
#epDesc{color:var(--mut);font-size:14px;line-height:1.55;margin-top:18px;white-space:pre-line}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;background:var(--bg);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-height:38px;padding:0 12px;border-radius:19px;background:var(--s1);color:var(--mut);font-weight:600;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.grid.g4{grid-template-columns:repeat(auto-fill,minmax(min(22%,96px),1fr));gap:12px 10px}
.grid.g4 .tile span{font-size:13px}
.more{display:block;margin:12px auto;min-height:44px;padding:0 20px;border-radius:22px;background:var(--s1);color:var(--ink);font-weight:600}
.rowx{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.rowx::-webkit-scrollbar{display:none}
.rowx .tile{flex:0 0 96px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(30%,120px),1fr));gap:14px 12px}
.tile{display:flex;flex-direction:column;gap:7px;text-align:left}
.tile .lg{width:100%;aspect-ratio:1;border-radius:16px}
.tile span{font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on .lg{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.lg{position:relative;display:grid;place-items:center;overflow:hidden;background:var(--c,#2a3038);color:#fff;font-weight:800;letter-spacing:-.02em}
.lg i{font-style:normal;font-size:17px}
.tile .lg i{font-size:26px}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:8%}
.lg img.cover{object-fit:cover;padding:0;background:#000}
.eq{position:absolute;right:6px;bottom:6px;display:flex;gap:2px;align-items:flex-end;height:14px;padding:3px;border-radius:6px;background:rgba(0,0,0,.6)}
.eq b{width:3px;background:var(--acc);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:-.3s}.eq b:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}
.paused .eq b{animation:none;height:4px}
/* lista */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;text-align:left;border-radius:12px}
.row .lg{width:52px;height:52px;border-radius:12px}
.row .tx{flex:1;display:flex;flex-direction:column;overflow:hidden}
.row b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on b{color:var(--acc2)}
.msg{color:var(--mut);text-align:center;padding:28px 12px}
.msg button{color:var(--acc2);font-weight:600}
#q,#pq{flex:1;font-size:16px;padding:12px 16px;border-radius:12px;border:0;background:var(--s2);color:var(--ink)}
/* músicas */
.song{display:flex;gap:12px;align-items:center;padding:8px 0;width:100%;text-align:left}
.song .lg{width:52px;height:52px;border-radius:8px}
.song .tx{flex:1;overflow:hidden}
.song b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .lk{display:flex;color:var(--mut);padding:0 6px}
.song .lk a{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--mut)}
.song .lk svg{width:20px;height:20px}
/* mini leitor + navegação */
#mini{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + var(--sb) + 6px);z-index:15;max-width:804px;margin:0 auto;display:flex;align-items:center;gap:10px;height:var(--mini);padding:8px 8px 8px 8px;border-radius:14px;background:var(--s2);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#mini[hidden]{display:none}
#miniOpen{flex:1;display:flex;align-items:center;gap:10px;text-align:left;overflow:hidden;min-height:52px}
#miniOpen .lg{width:52px;height:52px;border-radius:8px}
#miniOpen .tx{overflow:hidden}
#miniOpen b,#miniOpen small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniOpen b{font-size:15px}
#miniOpen small{font-size:13px;color:var(--mut)}
#miniPlay{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none}
#miniPlay svg{width:30px;height:30px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:14;display:flex;justify-content:space-around;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);background:rgba(11,13,16,.96);border-top:1px solid var(--line)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mut)}
#nav button[aria-current=page]{color:var(--ink)}
/* ecrã a tocar */
#np{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#np.open{transform:none;visibility:visible}
@media(prefers-reduced-motion:reduce){#np{transition:none}.eq b{animation:none;height:6px}}
.npbg{position:absolute;inset:0;height:min(90vh,820px);background:var(--npc,#2a3038);opacity:.55;mask-image:linear-gradient(#000 20%,transparent);-webkit-mask-image:linear-gradient(#000 20%,transparent);pointer-events:none}
.npbg img{width:100%;height:100%;object-fit:cover;filter:blur(40px) saturate(1.3);transform:scale(1.2)}
.npin{position:relative;max-width:520px;margin:0 auto;padding:calc(8px + var(--st)) 20px calc(28px + var(--sb))}
.nptop{display:flex;align-items:center;gap:6px}
.nptop .mid{flex:1;text-align:center;overflow:hidden}
.nptop small{display:block;font-size:12px;color:var(--mut)}
.nptop b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#npFav.is{color:var(--acc)}
.art{margin:18px auto 0;width:min(100%,58vh);aspect-ratio:1;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.art .lg{width:100%;height:100%;border-radius:14px}
.art .lg i{font-size:64px}
.live{display:flex;align-items:center;gap:8px;margin-top:22px;font-size:13px;color:var(--mut);overflow:hidden;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none;box-shadow:0 0 0 0 rgba(255,77,61,.6);animation:pulse 1.6s infinite}
.paused .live i{animation:none;background:var(--mut)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,77,61,0)}100%{box-shadow:0 0 0 0 rgba(255,77,61,0)}}
.live span{overflow:hidden;text-overflow:ellipsis}
#npTitle{margin:6px 0 2px;font-size:clamp(24px,6.5vw,32px);line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
#npArtist{margin:0;font-size:18px;color:var(--ink);opacity:.85}
#npAlbum{margin:4px 0 0;font-size:14px;color:var(--mut);min-height:20px}
.ctl{display:flex;align-items:center;justify-content:center;gap:28px;margin:22px 0 8px}
.ctl .ib svg{width:34px;height:34px}
#npPlay{width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
#npPlay svg{width:38px;height:38px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.acts>*{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--s1);font-size:12px;color:var(--mut);min-height:64px;justify-content:center;text-align:center}
.acts>*:active{background:var(--s2)}
.acts svg{color:var(--ink)}
.acts .hot{color:var(--acc2)}
.acts [aria-disabled=true]{opacity:.35;pointer-events:none}
.np-h h3{font-size:17px;margin:28px 0 6px}
/* telemóvel deitado: capa à esquerda, informação e controlos à direita */
@media (orientation:landscape) and (max-height:620px){
  .npin{max-width:1100px;display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);column-gap:32px;align-items:start;padding-left:calc(24px + env(safe-area-inset-left));padding-right:calc(24px + env(safe-area-inset-right))}
  .nptop{grid-column:1/-1}
  .art{grid-column:1;grid-row:2/span 8;width:min(100%,calc(100vh - 96px));margin:8px 0 0;position:sticky;top:8px}
  .npin>*:not(.nptop):not(.art){grid-column:2}
  .live{margin-top:10px}
  #npTitle{font-size:clamp(22px,3.4vw,30px)}
  .ctl{justify-content:flex-start;margin:14px 0 4px;gap:22px}
  #npPlay{width:64px;height:64px}
  .np-h h3{margin-top:18px}
  .lycov{width:min(30vw,200px)}
}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* letra */
#lyr{position:fixed;inset:0;z-index:35;background:#0b0d10;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#lyr.open{transform:none;visibility:visible}
.lyin{max-width:620px;margin:0 auto;padding:calc(8px + var(--st)) 22px calc(40px + var(--sb))}
.lyhd{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:8px 0 12px;background:linear-gradient(#0b0d10 80%,transparent)}
.lycov{width:min(62vw,280px);aspect-ratio:1;margin:4px auto 0;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.lycov .lg{width:100%;height:100%;border-radius:14px}.lycov .lg i{font-size:52px}
#lyT{margin:18px 0 2px;font-size:clamp(22px,6vw,28px);line-height:1.15;text-align:center;text-wrap:balance}
#lyA{margin:0;text-align:center;color:var(--mut);font-size:17px}
#ytBtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--acc);color:#fff;text-align:left}
#ytBtn .pvtx small{color:rgba(255,255,255,.85)}
.pv{width:min(62vw,280px);margin:12px auto 0;display:none}.pv.on{display:block}
.pv .bar{height:4px;border-radius:2px;background:var(--s2);overflow:hidden}.pv .bar i{display:block;height:100%;width:0;background:var(--acc)}
.pv small{display:block;text-align:center;color:var(--mut);font-size:12px;margin-top:6px}
#appChg[hidden]{display:none}#appChg{display:block;margin:8px auto 0;color:var(--mut);font-size:13px;padding:6px 10px}
#apps{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end}#apps.open{display:flex}
#apps .box{width:100%;background:var(--s1);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--sb))}
#apps h3{margin:0 0 10px;font-size:18px}#apps .lst button{display:block;width:100%;text-align:left;padding:14px 12px;border-radius:12px;font-size:16px;font-weight:600;color:var(--ink)}
#apps .lst button:active{background:var(--s2)}#apps label{display:flex;gap:10px;align-items:center;margin:10px 4px 4px;color:var(--mut);font-size:14px}#apps label input{width:20px;height:20px;accent-color:var(--acc)}
.ytic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}

.pvtx{flex:1;display:flex;flex-direction:column}.pvtx small{color:var(--mut);font-size:13px}
.lyh3{font-size:15px;color:var(--mut);margin:26px 0 0;font-weight:600}
.lyhd .tx{flex:1;overflow:hidden}
.lyhd b,.lyhd small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyhd small{color:var(--mut);font-size:14px}
#lyTxt{font-size:21px;line-height:1.55;font-weight:600;white-space:pre-wrap;margin-top:8px;color:#e9edf1}
#lyTxt.dim{font-size:16px;font-weight:400;color:var(--mut)}
.lysrc{margin-top:26px;font-size:12px;color:var(--mut)}
/* folha de definições + aviso */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sh{background:var(--s1);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + var(--sb))}
.sh h2{margin:0 0 6px;font-size:22px}
.sh p{color:var(--mut);margin:4px 0 10px;font-size:14px}
.sh label{display:block;font-weight:600;font-size:15px;margin-top:16px}
.sh input{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:6px}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;min-height:46px;border-radius:12px;background:var(--s2);font-weight:600}
.btns .pri{background:var(--acc);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--mini) + var(--sb) + 18px);z-index:50;transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.npopen #toast{bottom:auto;top:calc(14px + var(--st))}
.acts>*{padding:10px 2px}
</style>
</head>
<body>

<section class="view on" id="v-home">
  <header class="hd"><h1>Rádio</h1></header>
  <div class="tabs" role="tablist" id="homeTabs">
    <button role="tab" data-t="fav">Favoritas</button><button role="tab" data-t="main">Principais</button><button role="tab" data-t="rayo">Temáticas</button><button role="tab" data-t="all">Todas</button>
  </div>
  <div class="sec" id="homeBody"><p class="msg">A carregar rádios…</p></div>
</section>

<section class="view" id="v-pods">
  <header class="hd"><h1>Podcasts</h1><input id="pq" type="search" placeholder="Procurar podcasts" autocomplete="off" aria-label="Procurar podcasts"></header>
  <div class="sec" id="podBody"></div>
</section>

<section class="view" id="v-search">
  <header class="hd"><input id="q" type="search" placeholder="Rádio, cidade ou estilo" autocomplete="off" aria-label="Procurar"></header>
  <div class="sec"><div id="searchList"></div></div>
</section>

<section class="view" id="v-songs">
  <header class="hd"><h1>Músicas</h1></header>
  <div class="sec"><div id="songList"></div></div>
</section>

<div id="mini" hidden>
  <button id="miniOpen" aria-label="Abrir o que está a tocar"><span class="lg" id="miniArt"></span><span class="tx"><b id="miniT"></b><small id="miniS"></small></span></button>
  <button id="miniPlay" aria-label="Tocar ou pausar"></button>
</div>

<nav id="nav">
  <button data-v="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>Início</button>
  <button data-v="pods"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.6 1.4 4.8 3.5 6l.6-1.8A5 5 0 1 1 15 13.2l.6 1.8A7 7 0 0 0 12 2zm0 4a3 3 0 0 0-1.6 5.5L11 22h2l.6-10.5A3 3 0 0 0 12 6z"/></svg>Podcasts</button>
  <button data-v="search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 6 12l4.3 4.3-1.5 1.5-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2.2a5.3 5.3 0 1 0 0 10.6 5.3 5.3 0 0 0 0-10.6z"/></svg>Procurar</button>

function nativeAudio(){
  const a=new EventTarget();let src='',sent='',t=0,d=NaN,rate=1;
  a.paused=true;a.preload='none';a.buffered={length:0};a.textTracks=new EventTarget();a.startPos=0;
  Object.defineProperty(a,'src',{get:()=>src,set:v=>{src=v||''}});

  Object.defineProperty(a,'playbackRate',{get:()=>rate,set:v=>{rate=+v||1;try{if(NATIVE.speed)NATIVE.speed(rate)}catch(e){}}});
  a.getAttribute=k=>k==='src'&&src?src:null;a.removeAttribute=k=>{if(k==='src'){src='';sent=''}};a.load=()=>{};
  a.play=()=>{if(!src)return Promise.resolve();a.paused=false;
    try{
      if(mode==='pod'&&NATIVE.resume&&src===sent&&!a.startPos)NATIVE.resume();
      else{
        const m=mode==='pod'&&ep?{id:'ep:'+ep.id,name:ep.title,artist:ep.podName,logo:ep.art||'',podcast:true,pos:Math.round((a.startPos||0)*1000)}

  a.pause=()=>{const was=!a.paused;a.paused=true;
    try{if(mode==='pod'&&NATIVE.pause)NATIVE.pause();else{NATIVE.stop();sent=''}}catch(e){}
    if(was)a.dispatchEvent(new Event('pause'))};

    if(ev==='time'){const [p,q]=String(arg).split(',').map(Number);t=(p||0)/1000;d=q>0?q/1000:NaN;a.dispatchEvent(new Event('timeupdate'));return}
    if(ev==='playing')a.paused=false;

    a.dispatchEvent(new Event(ev));
  };
  return a;
}

function build(){
  const used=new Set();
  main=MAIN.map(m=>{
    const hits=dir.filter(d=>m.re.test(norm(d.name)));

    const best=hits[0]||{};
    const urls=[...(m.urls||[])];
    for(const h of hits)for(const u of [h.url,h.url2])if(u&&!urls.includes(u))urls.push(u);
    const b=BMAIN[m.id]&&bauer.find(x=>x.code===BMAIN[m.id]);
    if(b){for(const u of b.urls.slice().reverse())if(!urls.includes(u))urls.unshift(u);else{urls.splice(urls.indexOf(u),1);urls.unshift(u)}}
    const ok=LS.get('ok4_'+m.id,'');if(ok&&urls.includes(ok)){urls.splice(urls.indexOf(ok),1);urls.unshift(ok)}
    return {id:m.id,name:m.name,dom:m.dom,c:m.c,logo:(b&&b.logo)||best.logo||'',home:(b&&b.home)||best.home||'https://'+m.dom,tags:best.tags||[],state:'Nacional',urls,main:true,
      code:b?b.code:'',np:b?b.np:null,onair:b?b.onair:null,triton:m.triton||''};
  }).filter(m=>m.urls.length);
  const usedB=new Set(main.map(m=>m.code).filter(Boolean));
  rayo=bauer.filter(b=>!usedB.has(b.code)).map(b=>({id:'b-'+b.code,code:b.code,name:b.name,logo:b.logo,c:b.c,home:b.home,
    dom:(()=>{try{return new URL(b.home).hostname.replace(/^www\./,'')}catch(e){return ''}})(),tags:[],state:'Rayo',urls:b.urls,np:b.np,onair:b.onair,rayo:true}));
  const bkeys=new Set([...bauer.map(b=>bkey(b.name)),...main.map(m=>bkey(m.name))]);
  const seen=new Set(main.map(m=>norm(m.name)));
  const rest=[];
  for(const d of dir){
    if(used.has(d.id))continue;
    const k=norm(d.name);if(seen.has(k)||(bauer.length&&bkeys.has(bkey(d.name))))continue;seen.add(k);
    let dom='';try{dom=d.home?new URL(d.home).hostname.replace(/^www\./,''):''}catch(e){}
    const urls=[d.url];if(d.url2&&d.url2!==d.url)urls.push(d.url2);
    rest.push({id:d.id,name:d.name,dom,logo:d.logo,home:d.home,tags:d.tags,state:d.state,codec:d.codec,br:d.br,urls});

  if(!cur){const l=all.find(s=>s.id===LS.get('last',''));if(l){cur=l;paintPlayer()}}
  renderAll();
}

function clean(t){
  t=String(t||'').normalize('NFC').replace(/([aAoOnN])~/g,(m,c)=>({a:'ã',A:'Ã',o:'õ',O:'Õ',n:'ñ',N:'Ñ'})[c]).replace(/\s+/g,' ').trim().replace(/^[-–\s]+|[-–\s]+$/g,'');
  if(t.length<2||(cur&&norm(t)===norm(cur.name)))return '';
  return t;
}
/* aceita: "Artista - Música", XML da Bauer (RadioInfo), JSON, ID3 separado */
function parseMeta(raw){
  raw=String(raw||'').trim();if(!raw)return null;
  if(raw.startsWith('<')){
    try{
      const x=new DOMParser().parseFromString(raw,'text/xml');
      const g=(...ns)=>{for(const n of ns){const e=x.getElementsByTagName(n)[0];if(e&&e.textContent.trim())return e.textContent.trim()}return ''};
      const an=x.getElementsByTagName('AnimadorInfo')[0];
      let show='',showImg='';
      if(an){const t=an.getElementsByTagName('TITLE')[0]||an.getElementsByTagName('NAME')[0]||an.firstElementChild;show=t?t.textContent.trim():'';
        for(const e of an.getElementsByTagName('*')){const v=e.textContent.trim();if(/\.(png|jpe?g|webp)$/i.test(v)&&/[\/]/.test(v)){showImg=v;break}}}
      const tb=x.getElementsByTagName('Table')[0],tg=n=>{const e=tb&&tb.getElementsByTagName(n)[0];return e?e.textContent.trim():''};
      return {artist:tg('DB_DALET_ARTIST_NAME')||tg('DB_LEAD_ARTIST_NAME')||g('ARTIST','artist'),title:tg('DB_DALET_TITLE_NAME')||tg('DB_SONG_NAME')||(tb?'':g('title')),
        album:tg('DB_ALBUM_NAME'),video:tg('DB_SONG_VIDEO'),show,showImg};
    }catch(e){return null}
  }
  if(raw.startsWith('{')){try{const j=JSON.parse(raw);return {artist:j.artist||'',title:j.title||j.song||''}}catch(e){}}
  const t=clean(raw);if(!t)return {artist:'',title:''};
  const i=t.indexOf(' - ');
  return i>0?{artist:t.slice(0,i).trim(),title:t.slice(i+3).trim()}:{artist:'',title:t};
}
function gotMeta(m,src){
  if(!m||!cur)return;
  const title=clean(m.title),artist=clean(m.artist);
  if(m.show!==undefined)now.show=m.show;
  if(m.showImg!==undefined)now.showImg=m.showImg?(m.showImg.startsWith('/')?'https://'+(cur.dom||'')+m.showImg:m.showImg):'';
  if(!title){
    if(src!=='id'&&now.title){now={show:now.show,showImg:now.showImg,gap:true};renderAll()}
    else if(src!=='id')now.gap=true;
    metaOff=false;
    paintNow();return;
  }
  metaOff=false;
  const changed=norm(title)!==norm(now.title)||norm(artist)!==norm(now.artist);
  if(changed)now={show:now.show,showImg:now.showImg,title,artist,album:m.album||'',video:m.video||'',src,sp:m.sp||'',at:Date.now(),art:m.art||'',start:m.start||0,dur:m.dur||0};
  else Object.assign(now,{start:m.start||now.start,dur:m.dur||now.dur,at:src==='auto'&&!isEv(cur)?Date.now():now.at,album:m.album||now.album,video:m.video||now.video,sp:m.sp||now.sp,src:src==='id'?'id':now.src});
  if(changed){addHist();if(!now.art)fetchArt()}
  paintNow();renderAll();
}
function stopMeta(){metaGen++;clearTimeout(metaTimer)}
function startMeta(){
  stopMeta();const g=++metaGen,s=cur,url=s.urls[ci];
  if(s.code||s.triton){
    if(s.onair&&s.onair.episodeTitle)now.show=s.onair.episodeTitle;
    const run=async()=>{
      if(g!==metaGen)return;
      let ev=null;try{ev=s.code?await bauerEvents(s):await tritonEvents(s)}catch(e){}
      if(g!==metaGen)return;
      try{
        if(ev){
          for(const e of ev){const o=s.apiHist&&s.apiHist.find(y=>y.at===e.at);if(o&&o.art&&!e.art)e.art=o.art}
          s.apiHist=ev;const c0=ev[0];if(!s.code)histArt(s);
          const live=c0&&Date.now()<c0.at+((c0.dur||240)+75)*1000;
          if(live)gotMeta({artist:c0.artist,title:c0.title,art:c0.art,start:c0.at,dur:c0.dur},'api');else gotMeta({artist:'',title:''},'api');
          paintNow();
        }
      }catch(e){}
      finally{if(g===metaGen)metaTimer=setTimeout(run,15000)}
    };
    run();return;
  }
  if(isHlsUrl(url)){
    if(isEv(s)){ /* música chega pelo próprio áudio quando começa; tentar já a atual pelo stream normal */
      const alt=s.urls.find(u=>!isHlsUrl(u)),wk=WORKER;
      if(alt&&wk)viaWorker(wk,alt).then(raw=>{if(g!==metaGen||now.title||!raw||raw===UNCH)return;const m=parseMeta(raw);if(m&&clean(m.title))gotMeta(m,'auto')}).catch(()=>{});
      return;
    }
    metaTimer=setTimeout(()=>{if(g===metaGen&&!now.title){metaOff=true;paintNow()}},25000);return}
  const wk=WORKER;
  const run=async()=>{
    if(g!==metaGen)return;
    let raw=null;
    const tries=[];
    if(s.meta!=='ice'&&s.meta!=='icy'&&wk)tries.push(['wk',()=>viaWorker(wk,url)]);
    if(s.meta!=='wk'&&s.meta!=='icy')tries.push(['ice',()=>icecast(url)]);
    if(s.meta!=='wk'&&s.meta!=='ice')tries.push(['icy',()=>icy(url)]);
    for(const [k,f] of tries){try{raw=await f()}catch(e){raw=null}if(g!==metaGen)return;if(raw!=null){s.meta=k;break}}
    if(raw==null&&!s.meta){metaOff=true;paintNow();return}
    try{
      if(raw!=null&&raw!==UNCH){
        const m=parseMeta(raw)||{artist:'',title:''};
        if(clean(m.title))gotMeta(m,'auto');
        else if(isEv(s)){/* vazio = sem alteração */}
        else if(s.meta==='wk'||m.show!==undefined){gotMeta(Object.assign({},m,{title:'',artist:''}),'auto')} /* rádio a dizer "sem música": locução ou publicidade */
        else if(!now.title){metaOff=true;paintNow()}
      }
    }catch(e){}
    finally{if(g===metaGen)metaTimer=setTimeout(run,12000)}
  };
  run();
}
audio.textTracks.addEventListener('addtrack',e=>{

const UNCH='\u0000unchanged';
async function viaWorker(wk,url){
  const r=await fetch(wk.replace(/\/+$/,'')+'/meta?url='+encodeURIComponent(url)+'&_='+Date.now(),{signal:AbortSignal.timeout(15000),cache:'no-store'});
  if(!r.ok)return null;const j=await r.json();if(j.unchanged)return UNCH;return j.title==null?null:String(j.title);
}
async function icecast(url){
  const u=new URL(url);
  const r=await fetch(u.origin+'/status-json.xsl',{signal:AbortSignal.timeout(6000),cache:'no-store'});
  if(!r.ok)return null;const j=await r.json();let src=j&&j.icestats&&j.icestats.source;if(!src)return null;
  if(!Array.isArray(src))src=[src];
  const m=src.find(x=>x.listenurl&&new URL(x.listenurl,u.origin).pathname===u.pathname)||(src.length===1?src[0]:null);
  if(!m)return null;return String(m.artist&&m.title?m.artist+' - '+m.title:(m.title||''));
}
function decode(b){try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){let s='';for(const x of b)s+=String.fromCharCode(x);return s}}
async function icy(url){
  const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),12000);
  try{
    const r=await fetch(url,{headers:{'Icy-MetaData':'1'},signal:ctrl.signal,cache:'no-store'});
    const mi=parseInt(r.headers.get('icy-metaint'),10);if(!r.ok||!mi||!r.body){ctrl.abort();return null}
    const rd=r.body.getReader();let skip=mi,need=-1,buf=[],blocks=0;
    while(true){
      const {value,done}=await rd.read();if(done)return null;let i=0;
      while(i<value.length){
        if(skip>0){const n=Math.min(skip,value.length-i);skip-=n;i+=n;continue}
        if(need<0){need=value[i++]*16;buf=[];if(need===0){need=-1;skip=mi;if(++blocks>2){ctrl.abort();return ''}}continue}
        const n=Math.min(need,value.length-i);buf.push(value.slice(i,i+n));need-=n;i+=n;
        if(need===0){ctrl.abort();const all=new Uint8Array(buf.reduce((a,b)=>a+b.length,0));let o=0;for(const b of buf){all.set(b,o);o+=b.length}
          const m=decode(all).replace(/\0+$/,'').match(/StreamTitle='(.*?)';/s);return m?m[1]:''}
      }
    }
  }finally{clearTimeout(to)}
}

function parseLrc(t){
  if(!t)return null;const out=[];
  for(const line of String(t).split('\n')){
    const tags=[...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];if(!tags.length)continue;
    const txt=line.replace(/\[[^\]]*\]/g,'').trim();
    for(const m of tags)out.push({t:+m[1]*60+ +m[2],text:txt});
  }
  out.sort((a,b)=>a.t-b.t);return out.length>3?out:null;
}
const lyrCache=new Map();
/* variantes do título/artista: tira o nome do artista colado ao título, versões, "feat.", etc. */
function lyrVariants(artist,title){
  const A=String(artist||'').replace(/\s+(feat\.?|ft\.?|featuring|&|e|x|com|vs\.?)\s+.*$/i,'').replace(/,.*$/,'').trim();
  const aw=norm(artist).split(/[^a-z0-9]+/).filter(w=>w.length>=4);
  let t=String(title||'').replace(/\s*[\(\[].*?[\)\]]\s*/g,' ').replace(/\s+-\s+.*$/,'')
    .replace(/\b(feat\.?|ft\.?|featuring)\b.*$/i,'').replace(/\b(remaster(ed)?|radio edit|ao vivo|live|versão|version|edit)\b.*$/i,'').trim();
  // palavras do título que são o artista (ex.: "What A Wonderful World RAMONES")
  const t2=t.split(/\s+/).filter(w=>{const n=norm(w);return !(n.length>=4&&aw.some(x=>x.startsWith(n)||n.startsWith(x)))}).join(' ').trim();
  // palavras finais em MAIÚSCULAS num título com minúsculas costumam ser lixo
  const t3=/[a-z]/.test(t)?t.replace(/(\s+[A-Z0-9'’]{2,})+$/,'').trim():t;
  const ts=[...new Set([t2,t3,t].filter(x=>x&&x.length>1))];
  const as=[...new Set([A,String(artist||'').trim()].filter(Boolean))];
  return {ts,as};
}
async function getLyrics(artist,title,album,dur){
  const k=norm(artist+'|'+title);if(lyrCache.has(k))return lyrCache.get(k);
  const base='https://lrclib.net/api/';const qs=o=>Object.entries(o).filter(([,v])=>v).map(([a,v])=>a+'='+encodeURIComponent(v)).join('&');
  const ok=x=>x&&(x.plainLyrics||x.instrumental);
  const j=async u=>{try{const r=await fetch(u,{signal:AbortSignal.timeout(8000)});return r.ok?await r.json():null}catch(e){return null}};
  const {ts,as}=lyrVariants(artist,title);
  let res=null;
  for(const t of ts){
    for(const a of as){
      if(dur&&!ok(res))res=await j(base+'get?'+qs({artist_name:a,track_name:t,duration:Math.round(dur)}));
      if(!ok(res))res=await j(base+'get?'+qs({artist_name:a,track_name:t,album_name:album}));
      if(!ok(res)){const arr=await j(base+'search?'+qs({track_name:t,artist_name:a}));
        if(Array.isArray(arr))res=arr.find(x=>x.syncedLyrics&&(!dur||Math.abs((x.duration||0)-dur)<8))||arr.find(x=>x.plainLyrics)||arr.find(x=>x.instrumental)||null}
      if(ok(res))break;
    }
    if(ok(res))break;
    // só pelo título (o artista na rádio às vezes vem diferente)
    const arr=await j(base+'search?'+qs({q:(as[0]?as[0]+' ':'')+t}))||[];
    const arr2=arr.length?arr:(await j(base+'search?'+qs({track_name:t}))||[]);
    const an=norm(as[0]||'');
    res=arr2.find(x=>x.plainLyrics&&norm(x.trackName).includes(norm(t).slice(0,14))&&(!an||norm(x.artistName).includes(an.slice(0,5))||an.includes(norm(x.artistName).slice(0,5))))||null;
    if(ok(res))break;
  }
  // segunda fonte gratuita
  if(!ok(res)){
    for(const t of ts.slice(0,2)){
      const o=await j('https://api.lyrics.ovh/v1/'+encodeURIComponent(as[0]||'')+'/'+encodeURIComponent(t));
      if(o&&o.lyrics&&o.lyrics.trim().length>40){res={plainLyrics:o.lyrics.replace(/\r/g,'').replace(/^Paroles de la chanson.*\n/i,'').trim()};break}
    }
  }
  const out=ok(res)?{text:res.plainLyrics||'',instrumental:!!res.instrumental,lines:parseLrc(res.syncedLyrics)}:null;
  lyrCache.set(k,out);return out;
}

}
function openSheet(id){const el=$('#'+id);if(el.classList.contains('open'))return;el.classList.add('open');el.setAttribute('aria-hidden','false');el.scrollTop=0;try{history.pushState({sh:id},'')}catch(e){}}
function closeSheet(id,fromPop){const el=$('#'+id);if(!el.classList.contains('open'))return;el.classList.remove('open');el.setAttribute('aria-hidden','true');if(!fromPop&&history.state&&history.state.sh===id)(popSkip=true,history.back())}
async function openPod(id,hint){
  openPodId=id;podShown=40;
  const h=hint||subs.find(x=>x.id===id)||(podTop||[]).find(x=>x.id===id)||{id,name:''};
  paintPodHead(h);$('#podEps').innerHTML='<p class="msg">A carregar episódios…</p>';openSheet('pod');
  try{const p=await getPod(id);if(openPodId!==id)return;paintPodHead(Object.assign({},h,{name:p.name||h.name,author:p.author||h.author,art:h.art||p.art,desc:p.desc}));paintPodEps()}
  catch(e){if(openPodId===id)$('#podEps').innerHTML='<p class="msg">Não consegui carregar este podcast. Tenta outra vez mais tarde.</p>'}
}
function paintPodHead(h){
  const on=subs.some(x=>x.id===h.id);
  $('#podHead').innerHTML=`<div class="podhead">${lg({name:h.name||'?',c:hue(h.name||'?')},'',h.art)}<div><h2>${esc(h.name||'')}</h2><p>${esc(h.author||'')}</p><button class="follow${on?' on':''}" id="podFollow" data-id="${esc(h.id)}">${on?'A seguir':'Seguir'}</button></div></div>${h.desc?`<p class="poddesc">${esc(h.desc)}</p>`:''}`;
  $('#podFollow')._h=h;
}
function paintPodEps(){
  const p=podCache[openPodId];if(!p)return;
  const eps=p.episodes;
  $('#podEps').innerHTML=eps.length?eps.slice(0,podShown).map(e=>epRow(e,false)).join('')+(eps.length>podShown?'<button class="more" id="moreEps">Mostrar mais</button>':''):'<p class="msg">Este podcast ainda não tem episódios.</p>';
}
function findEp(id){if(epMeta[id])return epMeta[id];for(const k in podCache){const e=podCache[k].episodes.find(x=>x.id===id);if(e)return e}return null}
function playEp(e){
  if(mode==='radio'&&cur&&!audio.paused)stop();
  if(mode==='pod'&&ep&&ep.id!==e.id&&!audio.paused)saveEpPos(true);
  mode='pod';ep=e;
  epMeta[e.id]={id:e.id,podId:e.podId,podName:e.podName,title:e.title,url:e.url,art:e.art,dur:e.dur,date:e.date,desc:e.desc};
  const keys=Object.keys(epMeta);if(keys.length>60)keys.sort((a,b)=>((epPos[a]||{}).t||0)-((epPos[b]||{}).t||0)).slice(0,keys.length-60).forEach(k=>delete epMeta[k]);
  LS.set('epMeta',epMeta);LS.set('lastEp',e.id);
  const pp=epPos[e.id],pos=pp&&!pp.done?pp.pos:0;
  setBtn('load');
  if(NATIVE){audio.src=e.url;audio.startPos=pos;audio.play()}
  else{killHls();audio.src=e.url;audio.addEventListener('loadedmetadata',()=>{if(pos>5)try{audio.currentTime=pos}catch(x){}audio.playbackRate=epRate},{once:true});audio.play().catch(()=>setBtn('play'))}
  paintMiniEp();paintEp();openEp();ms();
}
function pauseEp(){if(!audio.paused)audio.pause();saveEpPos(true);setBtn('play');paintEp()}
function resumeEp(){if(!ep)return;if(!audio.getAttribute('src')){playEp(ep);return}setBtn('load');audio.play().catch(()=>setBtn('play'))}
function skipEp(dt){if(!ep||!audio.getAttribute('src'))return;const d=audio.duration;let t=(audio.currentTime||0)+dt;if(d>0)t=Math.min(t,d-1);audio.currentTime=Math.max(0,t);paintEpTime()}
function saveEpPos(force,ended){
  if(!ep)return;const p=audio.currentTime||0,d=(audio.duration>0?audio.duration:0)||ep.dur||0;
  if(!p&&!force&&!ended)return;
  epPos[ep.id]={pos:ended?d:p,dur:d,t:Date.now(),done:!!ended||(d>0&&p>=d-15)};
  if(force||ended||Date.now()-lastSave>5000){lastSave=Date.now();
    const ks=Object.keys(epPos);if(ks.length>300)ks.sort((a,b)=>epPos[a].t-epPos[b].t).slice(0,ks.length-300).forEach(k=>delete epPos[k]);
    LS.set('epPos',epPos)}
}
function paintMiniEp(){
  if(!ep)return;$('#mini').hidden=false;
  $('#miniArt').outerHTML=lg({name:ep.podName||'?',c:hue(ep.podName||'?')},'',ep.art).replace('class="lg ','id="miniArt" class="lg ');
  $('#miniT').textContent=ep.title;$('#miniS').textContent=ep.podName||'Podcast';
}
function paintEp(){
  if(!ep)return;
  $('#epArt').innerHTML=lg({name:ep.podName||'?',c:hue(ep.podName||'?')},'',ep.art);
  $('#epTitle').textContent=ep.title;$('#epPodLink').textContent=ep.podName||'';
  $('#epDesc').textContent=ep.desc||'';$('#epRate').textContent=String(epRate).replace('.',',')+'×';
  $('#epPlay').innerHTML=IC[audio.paused?'play':'pause'];
  paintEpTime();
  if($('#pod').classList.contains('open'))paintPodEps();
  if(view==='pods')renderPods();
}
function paintEpTime(){
  if(!ep)return;const d=(audio.duration>0?audio.duration:0)||ep.dur||(epPos[ep.id]||{}).dur||0;
  const t=mode==='pod'&&audio.getAttribute('src')?(audio.currentTime||0):((epPos[ep.id]||{}).pos||0);
  const bar=$('#epBar');if(!bar._drag){bar.max=Math.max(1,Math.round(d));bar.value=Math.round(t)}
  $('#epCur').textContent=fmtT(bar._drag?+bar.value:t);$('#epLeft').textContent=d?'-'+fmtT(d-(bar._drag?+bar.value:t)):'';
}
function openEp(){paintEp();openSheet('ep')}
function initPods(){
  $('#podBody').addEventListener('click',e=>{const t=e.target.closest('[data-pod]');if(t){openPod(t.dataset.pod,[...subs,...(podTop||[])].find(x=>x.id===t.dataset.pod));return}
    const r=e.target.closest('[data-ep]');if(r){const x=findEp(r.dataset.ep);if(x){if(mode==='pod'&&ep&&ep.id===x.id)toggle();else playEp(x)}}});
  $('#podEps').addEventListener('click',e=>{if(e.target.closest('#moreEps')){podShown+=40;paintPodEps();return}
    const r=e.target.closest('[data-ep]');if(!r)return;const x=findEp(r.dataset.ep);if(!x)return;
    if(mode==='pod'&&ep&&ep.id===x.id){if(e.target.closest('.pl'))toggle();else openEp()}else playEp(x)});
  $('#podHead').addEventListener('click',e=>{const b=e.target.closest('#podFollow');if(!b)return;const h=b._h;const i=subs.findIndex(x=>x.id===h.id);
    if(i>=0){subs.splice(i,1);toast('Deixaste de seguir')}else{const p=podCache[h.id];subs.unshift({id:h.id,name:h.name||(p&&p.name)||'',author:h.author||'',art:h.art||(p&&p.art)||'',feed:feedCache[h.id]||(p&&p.feed)||''});toast('A seguir '+(h.name||''))}
    LS.set('pods',subs);paintPodHead(h);lastStations='';pushStations()});
  let pt;$('#pq').addEventListener('input',e=>{clearTimeout(pt);pt=setTimeout(()=>{podQ=e.target.value.trim();podQ.length>=2?searchPods(podQ):renderPods()},400)});
  $('#podClose').addEventListener('click',()=>closeSheet('pod'));
  $('#epClose').addEventListener('click',()=>closeSheet('ep'));
  $('#epPodLink').addEventListener('click',()=>{if(ep&&ep.podId){closeSheet('ep');setTimeout(()=>openPod(ep.podId),320)}});
  $('#epPlay').addEventListener('click',toggle);
  $('#epBack').addEventListener('click',()=>skipEp(-15));
  $('#epFwd').addEventListener('click',()=>skipEp(30));
  $('#epSpeed').addEventListener('click',()=>{const R=[1,1.25,1.5,2,0.8];epRate=R[(R.indexOf(epRate)+1)%R.length];LS.set('epRate',epRate);if(mode==='pod')audio.playbackRate=epRate;paintEp()});
  $('#epSleep').addEventListener('click',cycleSleep);
  const bar=$('#epBar');
  bar.addEventListener('input',()=>{bar._drag=true;paintEpTime()});
  bar.addEventListener('change',()=>{bar._drag=false;if(mode==='pod'&&ep){if(!audio.getAttribute('src')){epPos[ep.id]={pos:+bar.value,dur:+bar.max,t:Date.now()};playEp(ep)}else audio.currentTime=+bar.value}paintEpTime()});
}
initPods();

/* ---------- ecrã de bloqueio ---------- */
function ms(){
  if(mode==='pod'){if(ep&&'mediaSession' in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({title:ep.title,artist:ep.podName,artwork:ep.art?[{src:ep.art,sizes:'600x600'}]:[]})}catch(e){}return}
  if(!cur)return;if(NATIVE){try{NATIVE.setNow(now.title||'',now.title?(now.artist||''):'',now.art||'')}catch(e){}}
  if(!('mediaSession' in navigator))return;
  const art=now.art?[{src:now.art,sizes:'600x600',type:'image/jpeg'}]:logoSrcs(cur).slice(0,1).map(src=>({src,sizes:'256x256'}));
  try{navigator.mediaSession.metadata=new MediaMetadata({title:now.title||cur.name,artist:now.title?(now.artist||cur.name):'Em direto',album:now.title?cur.name:'',artwork:art})}catch(e){}
}
if('mediaSession' in navigator){
  const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  set('play',()=>{if(!audio.paused)return;mode==='pod'?resumeEp():start()});set('pause',stopAll);set('stop',stopAll);
  set('nexttrack',()=>mode==='pod'?skipEp(30):step(1));set('previoustrack',()=>mode==='pod'?skipEp(-15):step(-1));
}



/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const st=e.target.closest('[data-id]');
  if(st&&!e.target.closest('#np')){const s=byId(st.dataset.id);if(s)play(s);return}
  const sg=e.target.closest('[data-lyr]');
  if(sg){const [a,t]=sg.dataset.lyr.split('|');const pool=[...hist,...((cur&&cur.apiHist)||[])];const h=pool.find(x=>(x.title||x.t)===t&&(x.artist||'')===a);openLyrics(a,t,'',h&&h.art,h&&h.video,false,true);return}
  if(e.target.closest('#retry')){loadDir(true);return}
  const clr=e.target.closest('#clrHist');
  if(clr){if(clr.dataset.ok){hist=[];LS.set('hist',hist);renderSongs();if(cur)paintNow()}else{clr.dataset.ok=1;clr.textContent='Toca outra vez para confirmar'}}
});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)setView(b.dataset.v)});
$('#homeTabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;homeTab=b.dataset.t;LS.set('tab',homeTab);allShown=60;renderHome();window.scrollTo({top:0})});
$('#homeBody').addEventListener('click',e=>{if(e.target.closest('#moreAll')){allShown+=60;renderHome()}});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{q=e.target.value;renderSearch()},120)});
$('#miniOpen').addEventListener('click',()=>mode==='pod'?openEp():openNP());
$('#miniPlay').addEventListener('click',toggle);
$('#npPlay').addEventListener('click',toggle);
$('#npClose').addEventListener('click',()=>closeNP());
$('#npPrev').addEventListener('click',()=>step(-1));
$('#npNext').addEventListener('click',()=>step(1));
$('#npSleep').addEventListener('click',cycleSleep);
$('#npLyr').addEventListener('click',()=>{if(now.title)openLyrics(now.artist,now.title,now.album,now.art,now.video)});
$('#lyClose').addEventListener('click',()=>closeLyrics());
$('#ytBtn').addEventListener('click',e=>{e.preventDefault();const a=APPS.find(x=>x.k===LS.get('musicApp',''));if(a&&installedApps().includes(a))openInApp(a);else pickApp()});
$('#appChg').addEventListener('click',pickApp);
$('#lyArt').addEventListener('click',togglePreview);
$('#apps').addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(b){const a=APPS.find(x=>x.k===b.dataset.app);if($('#appRem').checked)LS.set('musicApp',a.k);closeApps();songLinks();openInApp(a);return}if(e.target.id==='apps')closeApps()});

$('#npFav').addEventListener('click',()=>{
  if(!cur)return;favs.has(cur.id)?favs.delete(cur.id):favs.add(cur.id);LS.set('favs',[...favs]);
  $('#npFav').classList.toggle('is',favs.has(cur.id));toast(favs.has(cur.id)?'Adicionada às tuas rádios':'Removida das tuas rádios');renderAll();
});
/* deslizar para baixo fecha o ecrã a tocar */
{let y0=null;const np=$('#np');
 np.addEventListener('touchstart',e=>{y0=np.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
 np.addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>110)closeNP();y0=null},{passive:true});}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#lyr').classList.contains('open'))closeLyrics();else closeNP()}if(e.key===' '&&e.target===document.body){e.preventDefault();toggle()}});

/* migração: limpar caches antigas */
try{localStorage.removeItem('radpt_cache');localStorage.removeItem('radpt_cache2')}catch(e){}
hist=hist.map(h=>h.title?h:Object.assign(h,(()=>{const i=(h.t||'').indexOf(' - ');return i>0?{artist:h.t.slice(0,i),title:h.t.slice(i+3)}:{artist:'',title:h.t}})()))
  .filter(h=>!String(h.t||'').startsWith('<'));
setBtn('play');
build();
(async()=>{await loadBauer(false);build();loadDir(false)})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
setInterval(async()=>{
  await loadBauer(true);
  for(const st of all){if(!st.code)continue;const b=bauer.find(x=>x.code===st.code);if(b){st.np=b.np;st.onair=b.onair}}
  if(cur&&cur.code&&cur.onair&&cur.onair.episodeTitle){now.show=cur.onair.episodeTitle;paintNow()}
  renderAll();
},5*60e3);}
</script>
